# ==========================================================
#  بناء تطبيق «دليل اليمن» تلقائياً داخل مستودعك
#  المسار المطلوب:  .github/workflows/build.yml
#  التشغيل: تبويب Actions -> بناء دليل اليمن -> Run workflow
# ==========================================================

name: بناء دليل اليمن

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-22.04

    steps:
      - name: جلب ملفات المشروع
        run: |
          set -e
          PRIMARY="https://filebin.net/dalil-yemen-goldaden/dalil-yemen-source.zip"
          BACKUP="https://x0.at/YmcN.zip"
          if ! curl -fL --retry 5 --retry-all-errors --max-time 300 -o project.zip "$PRIMARY"; then
            echo "المصدر الأساسي تعذّر، تجربة الاحتياطي..."
            curl -fL --retry 5 --retry-all-errors --max-time 300 -o project.zip "$BACKUP"
          fi
          unzip -q project.zip
          ls -la
          test -f dalil-yemen/settings.gradle.kts
          echo "المشروع جاهز للبناء."

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز مكونات Android
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "مجلد أدوات أندرويد: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "أداة الإدارة: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > dalil-yemen/local.properties
          cat dalil-yemen/local.properties

      - name: بناء نسخة التطوير ونسخة الإصدار
        working-directory: dalil-yemen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: إتاحة التطبيق كأثر في صفحة Actions
        uses: actions/upload-artifact@v4
        with:
          name: dalil-yemen-apk
          path: |
            dalil-yemen/app/build/outputs/apk/debug/*.apk
            dalil-yemen/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: نشر التطبيق في صفحة Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: دليل اليمن 1.0.0
          body: |
            نسخة جاهزة للتحميل والتثبيت مباشرة.
            التطبيق: دليل اليمن
            معرّف الحزمة: com.dalilyemen.app
          files: |
            dalil-yemen/app/build/outputs/apk/debug/*.apk
            dalil-yemen/app/build/outputs/apk/release/*.apk
