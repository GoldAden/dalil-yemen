# ==========================================================
#  بناء تطبيق «دليل اليمن» تلقائياً
#  المسار: .github/workflows/build.yml
#  التشغيل: تلقائياً عند كل دفع إلى main أو master، أو يدوياً من
#  تبويب Actions -> بناء دليل اليمن -> Run workflow.
#  المشروع يُبنى من الشيفرة الموجودة في هذا المستودع نفسه.
# ==========================================================

name: بناء دليل اليمن

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-22.04

    steps:
      - name: جلب شيفرة المشروع
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز مكونات Android
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: بناء نسخة التطوير ونسخة الإصدار
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: إتاحة التطبيق كأثر في صفحة Actions
        uses: actions/upload-artifact@v4
        with:
          name: dalil-yemen-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: نشر التطبيق في صفحة Releases
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: دليل اليمن — بناء رقم ${{ github.run_number }}
          body: |
            نسخة جاهزة للتحميل والتثبيت مباشرة.
            التطبيق: دليل اليمن
            معرّف الحزمة: com.dalilyemen.app
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
