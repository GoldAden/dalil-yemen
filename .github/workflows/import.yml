# ==========================================================
#  استيراد ملفات مشروع «دليل اليمن» إلى مستودعك تلقائياً
#  المسار المطلوب:  .github/workflows/import.yml
#  التشغيل: تبويب Actions -> استيراد ملفات المشروع -> Run workflow
#  النتيجة: كل ملفات المشروع تظهر داخل مستودعك مباشرة
# ==========================================================

name: استيراد ملفات المشروع

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: استيراد الشيفرة إلى المستودع
    runs-on: ubuntu-22.04

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تنزيل ملفات المشروع
        run: |
          set -e
          PRIMARY="https://filebin.net/dalil-yemen-goldaden/dalil-yemen-source.zip"
          BACKUP="https://x0.at/YmcN.zip"
          if ! curl -fL --retry 5 --retry-all-errors --max-time 300 -o project.zip "$PRIMARY"; then
            echo "المصدر الأساسي تعذّر، تجربة الاحتياطي..."
            curl -fL --retry 5 --retry-all-errors --max-time 300 -o project.zip "$BACKUP"
          fi
          unzip -q project.zip
          test -f dalil-yemen/settings.gradle.kts
          echo "تم تنزيل المشروع بنجاح."

      - name: نسخ الملفات إلى جذر المستودع
        run: |
          set -e
          mkdir -p /tmp/src
          cp -a dalil-yemen/. /tmp/src/
          rm -rf dalil-yemen project.zip
          rm -rf /tmp/src/.github
          cp -a /tmp/src/. .
          echo "----- الملفات التي ستُرفع -----"
          git status --short

      - name: رفع الملفات إلى المستودع
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة."
          else
            git commit -m "استيراد ملفات مشروع دليل اليمن"
            git push
            echo "✅ تم رفع كل ملفات المشروع إلى المستودع."
          fi
